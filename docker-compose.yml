version: "3.9"
services:
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ids_user
      POSTGRES_PASSWORD: ids_pass
      POSTGRES_DB: ids_db
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  mongo_data:
  pg_data:
